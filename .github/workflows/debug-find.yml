name: debug-find
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev ninja-build

      - name: Configure with trace
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            --trace-expand --trace-redirect=/tmp/trace.log > configure.log 2>&1 || true

      - name: Analyze trace
        run: |
          echo "=== our CMakeLists lines 344-362 as executed ==="
          grep -nE "CMakeLists.txt:(34[5-9]|35[0-9]|36[0-3])\(" /tmp/trace.log | head -30
          echo "=== CURL_FOUND writes ==="
          grep -nE "set\(CURL_FOUND" /tmp/trace.log | head -20
          echo "=== find_package(CURL calls ==="
          grep -nE "find_package\(CURL" /tmp/trace.log | head -20
          echo "=== FindCURL early return / config branch ==="
          grep -nE "FindCURL.cmake:(7[0-9]|8[0-9]|9[0-9]|1[0-9][0-9])\(" /tmp/trace.log | head -40

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-trace
          path: |
            configure.log
          retention-days: 3
