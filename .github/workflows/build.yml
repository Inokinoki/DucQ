name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev ninja-build

      - name: Install Qt (macOS/Windows)
        if: matrix.name != 'linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10'
          arch: ${{ matrix.name == 'windows' && 'win64_msvc2022_64' || 'clang_64' }}
          cache: true

      # Make sure the MSVC environment wins over the MinGW in the runner PATH,
      # so Ninja picks cl.exe (the DuckDB/Qt artifacts are MSVC builds).
      - name: Set up MSVC (Windows)
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

      # Launch the real app, run the demo script and grab the window from
      # inside the process. Linux has no display server, so it uses the
      # offscreen platform; Windows/macOS runners have a desktop session and
      # use the native platform (offscreen lacks system fonts there).
      - name: Screenshot smoke
        working-directory: build
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ matrix.name == 'linux' && 'offscreen' || '' }}
        run: |
          case "$RUNNER_OS" in
            Windows) BIN="./DucQ.exe" ;;
            macOS)   BIN="./DucQ.app/Contents/MacOS/DucQ" ;;
            *)       BIN="./DucQ" ;;
          esac
          "$BIN" --execute ../scripts/demo.sql --screenshot "ducq-$RUNNER_OS.png" --screenshot-delay 2500
          test -s "ducq-$RUNNER_OS.png"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.name }}
          path: build/ducq-*.png
          if-no-files-found: warn
          retention-days: 14
