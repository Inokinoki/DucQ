name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default static build (with Quack) — also produces the screenshots.
          - name: linux
            os: ubuntu-latest
            cmake_args: ""
            vcpkg_args: -DDUCQ_VCPKG_OPENSSL_ROOT=/usr/local/share/vcpkg/installed/x64-linux
            screenshot: true
          - name: macos
            os: macos-latest
            cmake_args: ""
            screenshot: true
          - name: windows
            os: windows-latest
            cmake_args: ""
            vcpkg_args: -DDUCQ_CURL_ROOT=C:/vcpkg/installed/x64-windows-static-md
            screenshot: true
          # Quack compiled out — keeps the DUCQ_QUACK=OFF combination honest.
          - name: linux-noquack
            os: ubuntu-latest
            cmake_args: -DDUCQ_QUACK=OFF
            vcpkg_args: -DDUCQ_VCPKG_OPENSSL_ROOT=/usr/local/share/vcpkg/installed/x64-linux
            screenshot: false
          - name: macos-noquack
            os: macos-latest
            cmake_args: -DDUCQ_QUACK=OFF
            screenshot: false
          - name: windows-noquack
            os: windows-latest
            cmake_args: -DDUCQ_QUACK=OFF
            vcpkg_args: -DDUCQ_CURL_ROOT=C:/vcpkg/installed/x64-windows-static-md
            screenshot: false
          # Engine built from source with INSTALL/LOAD enabled. Heaviest leg
          # (the whole engine compiles), so it runs on one platform only; the
          # quack loopback exercises the LOAD path there.
          - name: linux-dynamic
            os: ubuntu-latest
            cmake_args: -DDUCQ_DYNAMIC_EXTENSIONS=ON
            screenshot: false
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev ninja-build libssl-dev libcurl4-openssl-dev

      - name: Install Qt (macOS/Windows)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || 'clang_64' }}
          cache: true

      # Make sure the MSVC environment wins over the MinGW in the runner PATH,
      # so Ninja picks cl.exe (the DuckDB/Qt artifacts are MSVC builds).
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # vcpkg fills the two platform gaps: Windows has no findable system
      # curl for MSVC (httpfs/S3), and delta's Linux cargo build insists on
      # vcpkg's static OpenSSL layout. Binary-cached, so only the first run
      # pays the source builds.
      - name: Cache vcpkg binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-curl-openssl-x64-windows-static-md-1

      - name: Install curl via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: vcpkg install "curl[openssl]" --triplet x64-windows-static-md

      - name: Cache vcpkg binaries (Linux)
        if: matrix.vcpkg_args != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-openssl-x64-linux-1

      - name: Install OpenSSL via vcpkg (Linux)
        if: matrix.vcpkg_args != ''
        shell: bash
        run: /usr/local/share/vcpkg/vcpkg install openssl --triplet x64-linux

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{ matrix.cmake_args }} ${{ matrix.vcpkg_args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        run: |
          if ctest --test-dir build --output-on-failure --timeout 300; then
            exit 0
          fi
          # A crashing Windows test loses its pipe-buffered stdout; re-run
          # with QtTest's file logger, which keeps completed test results.
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd build && ./test_core.exe -o test-out.txt,txt || true)
            cat build/test-out.txt || true
          fi
          exit 1

      # Launch the real app, run the demo script and grab the window from
      # inside the process. Linux has no display server, so it uses the
      # offscreen platform; Windows/macOS runners have a desktop session and
      # use the native platform (offscreen lacks system fonts there).
      - name: Screenshot smoke
        if: matrix.screenshot
        working-directory: build
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || '' }}
        run: |
          case "$RUNNER_OS" in
            Windows) BIN="./DucQ.exe" ;;
            macOS)   BIN="./DucQ.app/Contents/MacOS/DucQ" ;;
            *)       BIN="./DucQ" ;;
          esac
          "$BIN" --execute ../scripts/demo.sql --screenshot "ducq-$RUNNER_OS.png" --screenshot-delay 2500
          test -s "ducq-$RUNNER_OS.png"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.name }}
          path: build/ducq-*.png
          if-no-files-found: warn
          retention-days: 14
